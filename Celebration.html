<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>胜利庆祝 | Victory Celebration</title>
    <script src="js/lang-theme.js"></script>
    <script src="js/device-detect.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html[data-theme="dark"]  { color-scheme: dark; }
        html[data-theme="light"] { color-scheme: light; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #ffd700, #ff8c00, #ff4500);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            position: relative;
        }
        
        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 90%;
            width: 100%;
        }
        
        h1 {
            font-size: 3rem;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }
        
        .winner-display {
            font-size: 2rem;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            margin: 30px 0;
            font-weight: bold;
        }
        
        .container p {
            font-size: 1.2rem;
            margin: 15px 0;
            padding: 0 10px;
        }
        
        .btn {
            padding: 12px 25px;
            font-size: 1rem;
            background: linear-gradient(45deg, #ff0000, #ff4500);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 30px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            display: inline-block;
            text-decoration: none;
        }
        
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .btn-home {
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.7);
            margin-left: 12px;
        }

        .btn-home:hover {
            background: rgba(255, 255, 255, 0.4);
        }
        
        /* 移动端适配 */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
                max-width: 95%;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .winner-display {
                font-size: 1.5rem;
            }
            
            .container p {
                font-size: 1rem;
            }
            
            .btn {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
        }
        
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            border-radius: 50%;
            animation: fall linear forwards;
        }
        
        .btn {
            padding: 15px 30px;
            font-size: 1.2rem;
            background: linear-gradient(45deg, #ff0000, #ff4500);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 30px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        .firework {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            animation: explode 1s forwards;
        }
        
        @keyframes explode {
            0% {
                transform: translate(0, 0);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty));
                opacity: 0;
            }
        }

        .victory-line {
            color: white;
        }

        .copyright {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            font-family: Arial, sans-serif;
            z-index: 1000;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        /* ---------- 浅色主题覆盖（深色即上方既有规则） ---------- */
        body {
            transition: background-color 0.35s ease, color 0.35s ease;
        }

        html[data-theme="light"] body {
            background: linear-gradient(135deg, #ffedb0, #ffc76e, #ff9d66);
        }

        html[data-theme="light"] .container {
            background: rgba(255, 255, 255, 0.55);
        }

        html[data-theme="light"] h1 {
            color: #8a4a00;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }

        html[data-theme="light"] .winner-display {
            color: #6b3a00;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }

        html[data-theme="light"] .victory-line {
            color: #5c3300;
        }

        html[data-theme="light"] .btn-home {
            background: rgba(255, 255, 255, 0.6);
            border: 2px solid rgba(138, 74, 0, 0.45);
            color: #5c3300;
        }

        html[data-theme="light"] .btn-home:hover {
            background: rgba(255, 255, 255, 0.8);
        }

        html[data-theme="light"] .copyright {
            color: rgba(92, 51, 0, 0.75);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 data-i18n="title_h1">🎉 恭喜 🎉</h1>
        <div class="winner-display" id="winnerDisplay">Player 1 Wins!</div>
        <p class="victory-line" style="font-size: 1.5rem; margin: 20px 0;" data-i18n="victory_line1">获得了胜利！</p>
        <p class="victory-line" style="font-size: 1.2rem; margin: 20px 0;" data-i18n="victory_line2">You are the champion!</p>
        <a href="FootballGame.html" class="btn" data-i18n-html="btn_again">再来一局<br>Play Again</a>
        <a href="index.html" class="btn btn-home" data-i18n-html="btn_home">返回首页<br>Home</a>
    </div>

    <script>
        window.PAGE_META = {
            zh: {
                title: '胜利庆祝 | Victory Celebration',
                description: 'ERROR-CORE 足球大战胜利庆祝页：进球获胜后的烟花与彩带庆祝画面。',
                keywords: '胜利庆祝, 足球射门, ERROR-CORE, 小游戏'
            },
            en: {
                title: 'Victory Celebration | 胜利庆祝',
                description: 'ERROR-CORE Soccer Battle victory page: fireworks and confetti after you win the shootout.',
                keywords: 'victory celebration, soccer shootout, ERROR-CORE, mini-games'
            }
        };
        window.PAGE_I18N = {
            zh: {
                title_h1: '🎉 恭喜 🎉',
                victory_line1: '获得了胜利！',
                victory_line2: 'You are the champion!',
                btn_again: '再来一局<br>Play Again',
                btn_home: '返回首页<br>Home',
                win_p1: '玩家1 获胜！',
                win_p2: '玩家2 获胜！',
                win_suffix: ' 获胜！'
            },
            en: {
                title_h1: '🎉 Congratulations 🎉',
                victory_line1: 'Victory is yours!',
                victory_line2: 'You are the champion!',
                btn_again: 'Play Again<br>再来一局',
                btn_home: 'Back to Home<br>返回首页',
                win_p1: 'Player 1 Wins!',
                win_p2: 'Player 2 Wins!',
                win_suffix: ' Wins!'
            }
        };
    </script>

    <script>
        // 获取URL参数中的获胜者信息
        const urlParams = new URLSearchParams(window.location.search);
        const winner = urlParams.get('winner') || 'Player';
        const winnerDisplay = document.getElementById('winnerDisplay');

        // 显示获胜者
        function renderWinner() {
            if (winner === 'Player 1') {
                winnerDisplay.textContent = LT.t('win_p1');
            } else if (winner === 'Player 2') {
                winnerDisplay.textContent = LT.t('win_p2');
            } else {
                winnerDisplay.textContent = winner + LT.t('win_suffix');
            }
        }
        renderWinner();
        window.addEventListener('langchange', renderWinner);

        // 创建彩带效果
        function createConfetti() {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.top = '-10px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.width = Math.random() * 10 + 5 + 'px';
                    confetti.style.height = Math.random() * 10 + 5 + 'px';
                    confetti.style.animationDuration = Math.random() * 3 + 2 + 's';
                    document.body.appendChild(confetti);
                    
                    // 移除彩带元素以避免内存泄漏
                    setTimeout(() => {
                        confetti.remove();
                    }, 5000);
                }, i * 100);
            }
        }
        
        // 创建烟花效果
        function createFireworks() {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
            setInterval(() => {
                const centerX = Math.random() * window.innerWidth;
                const centerY = Math.random() * window.innerHeight / 2;
                
                for (let i = 0; i < 20; i++) {
                    const firework = document.createElement('div');
                    firework.className = 'firework';
                    firework.style.left = centerX + 'px';
                    firework.style.top = centerY + 'px';
                    firework.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    
                    const angle = (Math.PI * 2 * i) / 20;
                    const distance = 100 + Math.random() * 100;
                    const tx = Math.cos(angle) * distance;
                    const ty = Math.sin(angle) * distance;
                    
                    firework.style.setProperty('--tx', tx + 'px');
                    firework.style.setProperty('--ty', ty + 'px');
                    firework.style.animationDuration = '1s';
                    
                    document.body.appendChild(firework);
                    
                    setTimeout(() => {
                        firework.remove();
                    }, 1000);
                }
            }, 1500);
        }
        
        // 启动动画效果
        createConfetti();
        createFireworks();
    </script>
    <div class="copyright">
        © ERROR-CORE'Team All Rights Reserved
    </div>
</body>
</html>
