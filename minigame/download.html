<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>下载 - ERROR-CORE</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/device-detect.js" defer></script>
    <style>
        .logo-container {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            z-index: 1000;
        }

        .toolbar-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .error-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
            margin-right: 10px;
        }

        .toolbar {
            position: relative;
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 50%;
            border: 2px solid #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            cursor: pointer;
            transition: all 0.4s ease;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toolbar:hover {
            width: 220px;
            height: auto;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.8);
        }

        .toolbar-icon {
            color: #ffd700;
            font-size: 1.5rem;
            transition: all 0.4s ease;
            z-index: 3;
        }

        .toolbar:hover .toolbar-icon {
            opacity: 0;
            transform: scale(0.5);
        }

        .toolbar-content {
            display: none;
            flex-direction: column;
            align-items: stretch;
            gap: 8px;
            opacity: 0;
            transform: translateX(20px);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toolbar:hover .toolbar-content {
            display: flex;
            opacity: 1;
            transform: translateX(0);
        }

        .toolbar-item {
            opacity: 0;
            transform: translateX(10px);
            transition: all 0.3s ease;
        }

        .toolbar:hover .toolbar-item,
        .toolbar:hover .social-item {
            opacity: 1;
            transform: translateX(0);
        }

        .toolbar-item:nth-child(1) { transition-delay: 0.1s; }
        .toolbar-item:nth-child(2) { transition-delay: 0.15s; }
        .toolbar-item:nth-child(3) { transition-delay: 0.2s; }
        .toolbar-item:nth-child(4) { transition-delay: 0.25s; }
        .social-item:nth-child(5) { transition-delay: 0.3s; }
        .social-item:nth-child(6) { transition-delay: 0.35s; }

        .toolbar-title {
            color: #ffd700;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            padding: 8px 0;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .expanded-toolbar-icon {
            color: #ffd700;
            font-size: 1.5rem;
            transition: transform 0.8s linear;
            align-self: flex-end;
            margin-top: 5px;
        }

        .toolbar:hover .expanded-toolbar-icon {
            animation: rotate360 0.8s linear;
        }

        @keyframes rotate360 {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .toolbar-item, .social-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 215, 0, 0.9);
            color: #8b0000;
            border: none;
            border-radius: 5px;
            padding: 8px 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.4s ease;
            font-size: 0.9rem;
            min-width: 150px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .toolbar-item::before, .social-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: 0.5s;
        }

        .toolbar-item:hover, .social-item:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }

        .toolbar-item:hover::before, .social-item:hover::before {
            left: 100%;
        }

        .toolbar-item:active, .social-item:active {
            transform: translateY(1px) scale(0.98);
        }

        .social-icon-small {
            width: 20px;
            height: 20px;
        }

        /* 敬请期待容器 */
        .coming-soon-container {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 50px 30px;
            text-align: center;
            max-width: 600px;
            width: 90%;
            animation: fadeInUp 1s ease-out;
        }

        .coming-soon-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        .coming-soon-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
            margin-bottom: 15px;
        }

        .coming-soon-subtitle {
            font-size: 1.2rem;
            color: rgba(51, 51, 51, 0.8);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .coming-soon-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .copyright {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            font-family: Arial, sans-serif;
            z-index: 1000;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .toolbar-container {
                top: 10px;
                right: 10px;
            }

            .toolbar {
                width: 45px;
                height: 45px;
                cursor: pointer;
            }

            .toolbar:hover {
                width: 45px;
                height: 45px;
                border-radius: 50%;
                padding: 0;
                box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            }

            .toolbar:hover .toolbar-icon {
                opacity: 1;
                transform: scale(1);
            }

            .toolbar:hover .toolbar-content {
                display: none;
                opacity: 0;
                transform: translateX(20px);
            }

            .toolbar.expanded {
                width: 100%;
                border-radius: 10px;
                padding: 10px;
                box-shadow: 0 0 25px rgba(255, 215, 0, 0.8);
            }

            .toolbar.expanded .toolbar-icon {
                opacity: 0;
                transform: scale(0.5);
            }

            .toolbar.expanded .toolbar-content {
                display: flex;
                opacity: 1;
                transform: translateX(0);
            }

            .toolbar.expanded .toolbar-item,
            .toolbar.expanded .social-item {
                opacity: 1;
                transform: translateX(0);
            }

            .coming-soon-container {
                padding: 30px 20px;
            }

            .coming-soon-icon {
                font-size: 3rem;
            }

            .coming-soon-title {
                font-size: 1.8rem;
            }

            .coming-soon-subtitle {
                font-size: 1rem;
            }

            .coming-soon-badge {
                padding: 12px 30px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="picture/error.png" alt="ERROR Logo" class="error-logo">
    </div>

    <div class="toolbar-container">
        <div class="toolbar">
            <div class="toolbar-icon">⚙️</div>
            <div class="toolbar-content">
                <div class="toolbar-title">工具栏<br>Toolbar</div>
                <a href="minigame.html" class="toolbar-item">
                    <span>🏠</span>
                    <span>首页<br>Home</span>
                </a>
                <a href="download.html" class="toolbar-item">
                    <span>⬇️</span>
                    <span>下载<br>Download</span>
                </a>
                <a href="contact.html" class="toolbar-item">
                    <span>📞</span>
                    <span>联系我们<br>Contact</span>
                </a>
                <a href="https://space.bilibili.com/3546631121144154" class="social-item" target="_blank">
                    <img src="picture/bilibili.svg" alt="Bilibili" class="social-icon-small">
                    <span>B站<br>Bilibili</span>
                </a>
                <a href="https://www.douyin.com/user/MS4wLjABAAAA0cxdKFB-D6ucvm2i3AE92bzBC-xSHgmW0ew1iwh0Isx-DwXKsMF499VcAle9571J" class="social-item" target="_blank">
                    <img src="picture/douyin.svg" alt="抖音" class="social-icon-small">
                    <span>抖音<br>Douyin</span>
                </a>
                <div class="expanded-toolbar-icon">⚙️</div>
            </div>
        </div>
    </div>

    <div class="stars" id="stars"></div>

    <div class="container">
        <div class="coming-soon-container">
            <div class="coming-soon-icon">🔒</div>
            <h1 class="coming-soon-title">敬请期待</h1>
            <p class="coming-soon-subtitle">
                下载功能正在开发中<br>
                Download feature is under development
            </p>
            <div class="coming-soon-badge">
                Coming Soon...
            </div>
        </div>
    </div>

    <script>
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 100;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (Math.random() * 3 + 2) + 's';
                starsContainer.appendChild(star);
            }
        }

        window.addEventListener('load', function() {
            // 设备检测逻辑
            function detectDevice() {
                const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                const isTablet = /iPad|Android|webOS|BlackBerry|PlayBook|IEMobile|Opera Mini/i.test(navigator.userAgent) && window.screen.width >= 768;
                
                return {
                    isMobile: isMobile && !isTablet,
                    isTablet: isTablet,
                    isDesktop: !isMobile && !isTablet,
                    userAgent: navigator.userAgent,
                    screenWidth: window.screen.width,
                    innerWidth: window.innerWidth
                };
            }

            // 根据设备类型应用不同的样式
            function applyDeviceStyles() {
                const device = detectDevice();
                
                document.body.classList.remove('mobile-device', 'tablet-device', 'desktop-device');
                
                if (device.isMobile) {
                    document.body.classList.add('mobile-device');
                    console.log('📱 检测到移动设备');
                } else if (device.isTablet) {
                    document.body.classList.add('tablet-device');
                    console.log('📱 检测到平板设备');
                } else {
                    document.body.classList.add('desktop-device');
                    console.log('💻 检测到电脑设备');
                }
            }

            applyDeviceStyles();

            let resizeTimeout;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(function() {
                    applyDeviceStyles();
                }, 250);
            });

            // 移动端工具栏点击展开功能
            const toolbar = document.querySelector('.toolbar');
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            if (isMobile && toolbar) {
                toolbar.addEventListener('click', function(e) {
                    e.stopPropagation();
                    toolbar.classList.toggle('expanded');
                });

                document.addEventListener('click', function(e) {
                    if (!toolbar.contains(e.target)) {
                        toolbar.classList.remove('expanded');
                    }
                });
            }

            createStars();
        });
    </script>
    <div class="copyright">
        © ERROR-CORE'Team All Rights Reserved
    </div>
</body>
</html>
