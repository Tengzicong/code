<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ERROR-CORE 足球大战胜利庆祝页：分出胜负后的烟花与彩带庆祝画面，可再来一局或返回首页。">
    <meta name="keywords" content="胜利庆祝, 足球射门, ERROR-CORE, 小游戏">
    <title>胜利庆祝 | Victory Celebration</title>
    <script src="js/lang-theme.js"></script>
    <script src="js/device-detect.js"></script>
    <link rel="icon" type="image/png" href="picture/error-icon.png">
    <link rel="apple-touch-icon" href="picture/error-icon.png">
    <script src="js/cookie-consent.js" defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html[data-theme="dark"]  { color-scheme: dark; }
        html[data-theme="light"] { color-scheme: light; }

        body {
            min-height: 100vh;
            background:
                radial-gradient(1100px 520px at 50% -8%, rgba(255, 200, 60, 0.22), rgba(255, 200, 60, 0) 70%),
                #f5f5f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'SF Pro Text', ui-sans-serif, system-ui, -apple-system,
                BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            overflow: hidden;
            position: relative;
            color: #1d1d1f;
        }
        
        .container {
            text-align: center;
            z-index: 10;
            padding: 36px 28px;
            background: #ffffff;
            border: 1px solid #d6d6d6;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(180, 140, 30, 0.14);
            max-width: 90%;
            width: 100%;
        }
        
        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #b8860b, #e6b422 45%, #b8860b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: pulse 1.5s infinite;
        }
        
        .winner-display {
            font-size: 2rem;
            color: #1d1d1f;
            margin: 18px 0 8px;
            font-weight: 600;
        }
        
        .victory-line {
            color: #1d1d1f;
            font-size: 1.15rem;
            margin: 8px 0 0;
            padding: 0 10px;
        }
        
        .btn-row {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 30px;
        }
        
        .btn {
            padding: 14px 30px;
            font-size: 1.15rem;
            background: #0071e3;
            color: white;
            border: none;
            border-radius: 980px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s ease, box-shadow 0.2s ease;
            display: inline-block;
            text-decoration: none;
            box-shadow: 0 6px 16px rgba(0, 113, 227, 0.25);
        }
        
        .btn:hover {
            background: #0077ed;
        }

        .btn-home {
            background: #f5f5f7;
            border: 1px solid #d6d6d6;
            color: #1d1d1f;
            font-weight: 500;
            box-shadow: none;
        }

        .btn-home:hover {
            background: #ececf1;
        }
        
        /* 移动端适配 */
        @media (max-width: 768px) {
            .container {
                padding: 24px 16px;
                max-width: 95%;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .winner-display {
                font-size: 1.5rem;
            }
            
            .victory-line {
                font-size: 1rem;
            }
            
            .btn {
                padding: 11px 24px;
                font-size: 0.95rem;
            }
        }
        
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            border-radius: 50%;
            animation: fall linear forwards;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        .firework {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            animation: explode 1s forwards;
        }
        
        @keyframes explode {
            0% {
                transform: translate(0, 0);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty));
                opacity: 0;
            }
        }

        .copyright {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #86868b;
            font-size: 0.9rem;
            font-family: inherit;
            z-index: 1000;
        }

        /* ---------- 深色主题覆盖（浅色为 Apple 白画廊默认） ---------- */
        body {
            transition: background-color 0.35s ease, color 0.35s ease;
        }

        html[data-theme="dark"] body {
            background:
                radial-gradient(1100px 520px at 50% -8%, rgba(255, 200, 60, 0.14), rgba(255, 200, 60, 0) 70%),
                #000000;
            color: #f5f5f7;
        }

        html[data-theme="dark"] .container {
            background: #1c1c1e;
            border-color: rgba(255, 255, 255, 0.16);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        html[data-theme="dark"] h1 {
            background: linear-gradient(135deg, #ffd766, #f5c542 45%, #ffd766);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        html[data-theme="dark"] .winner-display,
        html[data-theme="dark"] .victory-line {
            color: #f5f5f7;
        }

        html[data-theme="dark"] .btn {
            background: #0a84ff;
        }

        html[data-theme="dark"] .btn:hover {
            background: #409cff;
        }

        html[data-theme="dark"] .btn-home {
            background: #2c2c2e;
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #f5f5f7;
        }

        html[data-theme="dark"] .btn-home:hover {
            background: #3a3a3c;
        }

        html[data-theme="dark"] .copyright {
            color: #86868b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 data-i18n="title_h1">🎉 恭喜 🎉</h1>
        <div class="winner-display" id="winnerDisplay">Player 1 Wins!</div>
        <p class="victory-line" data-i18n="victory_line">你就是本场冠军！</p>
        <div class="btn-row">
            <a href="FootballGame.html" class="btn" data-i18n="btn_again">再来一局</a>
            <a href="index.html" class="btn btn-home" data-i18n="btn_home">返回首页</a>
        </div>
    </div>

    <script>
        window.PAGE_META = {
            zh: {
                title: '胜利庆祝 | Victory Celebration',
                description: 'ERROR-CORE 足球大战胜利庆祝页：分出胜负后的烟花与彩带庆祝画面，可再来一局或返回首页。',
                keywords: '胜利庆祝, 足球射门, ERROR-CORE, 小游戏'
            },
            en: {
                title: 'Victory Celebration | 胜利庆祝',
                description: 'ERROR-CORE Soccer Battle victory page: fireworks and confetti after the shootout — play again or head back home.',
                keywords: 'victory celebration, soccer shootout, ERROR-CORE, mini-games'
            }
        };
        window.PAGE_I18N = {
            zh: {
                title_h1: '🎉 恭喜 🎉',
                victory_line: '你就是本场冠军！',
                btn_again: '再来一局',
                btn_home: '返回首页',
                win_p1: '玩家 1 获胜！',
                win_p2: '玩家 2 获胜！',
                win_suffix: ' 获胜！'
            },
            en: {
                title_h1: '🎉 Congratulations 🎉',
                victory_line: 'You are the champion!',
                btn_again: 'Play Again',
                btn_home: 'Back to Home',
                win_p1: 'Player 1 Wins!',
                win_p2: 'Player 2 Wins!',
                win_suffix: ' Wins!'
            }
        };
    </script>

    <script>
        // 获取URL参数中的获胜者信息
        const urlParams = new URLSearchParams(window.location.search);
        const winner = urlParams.get('winner') || 'Player';
        const winnerDisplay = document.getElementById('winnerDisplay');

        // 显示获胜者
        function renderWinner() {
            if (winner === 'Player 1') {
                winnerDisplay.textContent = LT.t('win_p1');
            } else if (winner === 'Player 2') {
                winnerDisplay.textContent = LT.t('win_p2');
            } else {
                winnerDisplay.textContent = winner + LT.t('win_suffix');
            }
        }
        renderWinner();
        window.addEventListener('langchange', renderWinner);

        // 创建彩带效果
        function createConfetti() {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.top = '-10px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.width = Math.random() * 10 + 5 + 'px';
                    confetti.style.height = Math.random() * 10 + 5 + 'px';
                    confetti.style.animationDuration = Math.random() * 3 + 2 + 's';
                    document.body.appendChild(confetti);
                    
                    // 移除彩带元素以避免内存泄漏
                    setTimeout(() => {
                        confetti.remove();
                    }, 5000);
                }, i * 100);
            }
        }
        
        // 创建烟花效果
        function createFireworks() {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
            setInterval(() => {
                const centerX = Math.random() * window.innerWidth;
                const centerY = Math.random() * window.innerHeight / 2;
                
                for (let i = 0; i < 20; i++) {
                    const firework = document.createElement('div');
                    firework.className = 'firework';
                    firework.style.left = centerX + 'px';
                    firework.style.top = centerY + 'px';
                    firework.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    
                    const angle = (Math.PI * 2 * i) / 20;
                    const distance = 100 + Math.random() * 100;
                    const tx = Math.cos(angle) * distance;
                    const ty = Math.sin(angle) * distance;
                    
                    firework.style.setProperty('--tx', tx + 'px');
                    firework.style.setProperty('--ty', ty + 'px');
                    firework.style.animationDuration = '1s';
                    
                    document.body.appendChild(firework);
                    
                    setTimeout(() => {
                        firework.remove();
                    }, 1000);
                }
            }, 1500);
        }
        
        // 启动动画效果
        createConfetti();
        createFireworks();
    </script>
    <div class="copyright">
        © ERROR-CORE'Team All Rights Reserved
    </div>
</body>
</html>
