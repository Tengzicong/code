        .drawing-container {
            background: #ffffff;

            display: flex;
            align-items: center;
            gap: 10px;

        .tool-group label {

        #colorPicker {

            height: 40px;
            padding: 0;
            border: 1px solid #d6d6d6;
            border-radius: 50%;
            cursor: pointer;
            background: none;

        #brushSize {

            cursor: pointer;
        }

        #brushSizeValue {
            display: inline-block;
            min-width: 2ch;

            color: #1d1d1f;

        .tool-options {
            display: inline-flex;
            border: 1px solid #d6d6d6;
            border-radius: 980px;

        .tool-option {

            font-weight: 500;
            cursor: pointer;
            opacity: .65;
            transition: background 0.2s ease, opacity 0.2s ease;
            white-space: nowrap;
        }

        .tool-option + .tool-option {
            border-left: 1px solid #d6d6d6;
        }

        .tool-option:hover {

        .tool-option.selected {

        .tool-btn {

        .canvas-container {

<body>
    <span class="lt-mount"></span>
    <a href="gamecenter.html" class="back-btn" data-i18n="back_btn">← 返回首页</a>

    <div class="stars" id="stars"></div>

    <div class="container">
        <div class="drawing-container">
            <div class="drawing-header">
                <h1 class="drawing-title" data-i18n-html="drawing_heading">🎨 在线画板</h1>
            </div>

            <div class="drawing-toolbar">
                <div class="tool-group">
                    <label for="colorPicker" data-i18n="color_label">颜色:</label>
                    <input type="color" id="colorPicker" value="#000000">
                </div>
                <div class="tool-group">
                    <label data-i18n="tool_label">工具:</label>
                    <div class="tool-options" role="group" aria-label="Tools">
                        <button type="button" class="tool-option selected" data-tool="round" data-i18n="brush_round">圆头笔</button>
                        <button type="button" class="tool-option" data-tool="square" data-i18n="brush_square">方头笔</button>
                        <button type="button" class="tool-option" data-tool="marker" data-i18n="brush_marker">马克笔</button>
                        <button type="button" class="tool-option" id="eraserBtn" data-tool="eraser" data-i18n="eraser_btn">橡皮擦</button>
                    </div>
                </div>
                <div class="tool-group">
                    <label for="brushSize" data-i18n="brush_label">画笔大小:</label>
                    <input type="range" id="brushSize" min="1" max="50" value="5">
                    <span id="brushSizeValue">5</span>
                </div>
                <button class="tool-btn" id="clearBtn" data-i18n="clear_btn">清空画布</button>
            </div>

            <div class="canvas-container">
                <canvas id="drawingCanvas" width="800" height="500"></canvas>
            </div>

            <div class="save-section">
                <button class="save-btn" id="saveBtn" data-i18n="save_btn">💾 保存为PNG</button>
            </div>
        </div>

        <section class="game-info">
            <h2 data-i18n="info_h2">使用说明</h2>
            <p data-i18n="info_p1">选择颜色，拖动滑块调节画笔粗细，即可在画布上绘制，支持鼠标与触屏。完成后点击"保存为 PNG"下载作品，"清空画布"可重新开始。</p>
            <p data-i18n="info_p2">画板在浏览器本地运行，作品不会上传服务器，刷新页面前请先保存。</p>
        </section>
    </div>

    <script>
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 100;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (Math.random() * 3 + 2) + 's';
                starsContainer.appendChild(star);
            }
        }

        window.addEventListener('load', function() {
            // 设备检测与工具栏逻辑由 js/device-detect.js 统一提供
            createStars();

            const canvas = document.getElementById('drawingCanvas');
            const ctx = canvas.getContext('2d');
            const colorPicker = document.getElementById('colorPicker');
            const brushSize = document.getElementById('brushSize');
            const brushSizeValue = document.getElementById('brushSizeValue');
            const clearBtn = document.getElementById('clearBtn');
            const saveBtn = document.getElementById('saveBtn');

            let isDrawing = false;
            let lastX = 0;
            let lastY = 0;
            let currentTool = 'round';

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            brushSize.addEventListener('input', function() {
                brushSizeValue.textContent = this.value;
            });

            // 工具切换：圆头笔 / 方头笔 / 马克笔（半透明宽笔触）/ 橡皮擦
            document.querySelectorAll('.tool-option').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    currentTool = btn.dataset.tool;
                    document.querySelectorAll('.tool-option').forEach(function (b) {
                        b.classList.toggle('selected', b === btn);
                    });
                });
            });

            function applyToolStyle() {
                if (currentTool === 'eraser') {
                    ctx.strokeStyle = '#ffffff';
                    ctx.globalAlpha = 1;
                    ctx.lineCap = 'round';
                    ctx.lineWidth = brushSize.value * 2;
                } else if (currentTool === 'square') {
                    ctx.strokeStyle = colorPicker.value;
                    ctx.globalAlpha = 1;
                    ctx.lineCap = 'butt';
                    ctx.lineJoin = 'miter';
                    ctx.lineWidth = brushSize.value;
                } else if (currentTool === 'marker') {
                    ctx.strokeStyle = colorPicker.value;
                    ctx.globalAlpha = 0.35;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.lineWidth = brushSize.value * 2.5;
                } else {
                    ctx.strokeStyle = colorPicker.value;
                    ctx.globalAlpha = 1;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.lineWidth = brushSize.value;
                }
            }

            function startDrawing(e) {
                isDrawing = true;
                [lastX, lastY] = getCoordinates(e);
            }

            function draw(e) {
                if (!isDrawing) return;

                const [currentX, currentY] = getCoordinates(e);

                applyToolStyle();
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(currentX, currentY);
                ctx.stroke();

                [lastX, lastY] = [currentX, currentY];
            }

            function stopDrawing() {
                isDrawing = false;
            }

            // 坐标按 canvas 内部像素与实际显示尺寸的比例换算：
            // 移动端 CSS 将画布缩放为 width:100%，直接用 clientX-rect.left 会错位
            function getCoordinates(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                let clientX, clientY;
                if (e.touches && e.touches.length) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else if (e.changedTouches && e.changedTouches.length) {
                    clientX = e.changedTouches[0].clientX;
                    clientY = e.changedTouches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                return [(clientX - rect.left) * scaleX, (clientY - rect.top) * scaleY];
            }

            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);

            // 触屏：passive:false + preventDefault，阻止绘制手势触发页面滚动/平移（修复移动端画画时画面移动）
            canvas.addEventListener('touchstart', function (e) {
                e.preventDefault();
                startDrawing(e);
            }, { passive: false });
            canvas.addEventListener('touchmove', function (e) {
                e.preventDefault();
                draw(e);
            }, { passive: false });
            canvas.addEventListener('touchend', function (e) {
                e.preventDefault();
                stopDrawing();
            }, { passive: false });

            clearBtn.addEventListener('click', function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            });

            saveBtn.addEventListener('click', function() {
                const exportCanvas = document.createElement('canvas');
                exportCanvas.width = canvas.width;
                exportCanvas.height = canvas.height;
                const exportCtx = exportCanvas.getContext('2d');

                exportCtx.fillStyle = 'white';
                exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

                exportCtx.drawImage(canvas, 0, 0);

                const dataURL = exportCanvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.download = 'drawing.png';
                link.href = dataURL;
                link.click();
            });
        });
    </script>
